[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netguard-ids"
version = "0.3.0"
description = "A lightweight, explainable network intrusion detection system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amir Farshad" }]
dependencies = []

[project.optional-dependencies]
pcap = ["scapy>=2.5.0"]
ml = ["joblib>=1.4", "pandas>=2.2", "scikit-learn>=1.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
netguard = "netguard_ids.cli:main"
netguard-ml = "netguard_ids.ml_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
